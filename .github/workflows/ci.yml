name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    # WPF exige Windows : la compilation du markup (PresentationBuildTasks)
    # n'existe pas sur les autres plateformes.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Babel.sln

      - name: Build
        run: dotnet build Babel.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Babel.Core.Tests/Babel.Core.Tests.csproj -c Release --no-build --verbosity normal
