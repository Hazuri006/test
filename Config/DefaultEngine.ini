[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/StellarFrontier.StellarFrontierGameMode
; Point these at your maps once created in-editor, e.g.:
; EditorStartupMap=/Game/Maps/L_SolarSystem.L_SolarSystem
