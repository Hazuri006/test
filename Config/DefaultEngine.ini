[/Script/Engine.RendererSettings]
; --- High-quality rendering defaults (UE5) ---
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
; Lumen global illumination + reflections for dynamic day/night on planets.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Virtual Shadow Maps pair well with Nanite for crisp planet-scale shadows.
r.Shadow.Virtual.Enable=1
; Nanite + mesh distance fields (needed by some Lumen features).
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
; Forward to a high-fidelity default; scalability can dial this down per machine.
r.SkinCache.CompileShaders=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.Engine]
; Large World Coordinates is on by default in UE5; planet math relies on it.

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0
bEnableEnhancedDeterminism=False
