<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subnautica — Planet 4546B (Browser Recreation)</title>
<!--
  SUBNAUTICA — a single-file, fully procedural browser recreation.
  Only external dependency: Three.js (ES module via import map). Every mesh, texture and sound is
  generated in code at runtime. Double-click the file to play (an internet connection is needed once
  to fetch Three.js from the CDN).
  Module map (search for "===== MODULE:" in the script below):
    Core/Settings/Input -> Terrain/Voxel (shared with Web Workers) -> Terrain streaming/Collision ->
    Renderer/Post -> Sky/Ocean/Weather -> Flora -> Creature meshes/Animation -> Creature AI/Leviathans ->
    World objects (Lifepod, Aurora, wrecks, precursor) -> Items/Inventory/Crafting -> Player/Survival/Tools ->
    Habitat building/Base power -> Vehicles (Seamoth, Prawn Suit, Cyclops) -> Story -> UI/HUD/PDA ->
    Audio -> Save/Load -> Main loop.
-->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
:root{
  --cy:#6ff3ff; --cy2:#29c6e0; --cyd:rgba(20,120,150,.35); --pan:rgba(6,26,38,.82); --pan2:rgba(10,44,60,.9);
  --txt:#dff9ff; --dim:#8fb9c4; --warn:#ffcf4a; --bad:#ff5a4e; --good:#7dff9a; --o2:#7fe6ff; --hp:#ff7070; --food:#ffc05a; --water:#6fb6ff;
  --font: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:var(--font);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui .hit{pointer-events:auto}
.hidden{display:none !important}
button{font-family:var(--font)}
/* ---------------- generic panels ---------------- */
.panel{background:linear-gradient(180deg,rgba(8,38,52,.92),rgba(4,20,30,.94));border:1px solid rgba(111,243,255,.35);border-radius:10px;box-shadow:0 0 30px rgba(0,180,220,.18),inset 0 0 40px rgba(0,160,200,.08);backdrop-filter:blur(6px)}
.btn{pointer-events:auto;cursor:pointer;background:rgba(20,80,100,.35);border:1px solid rgba(111,243,255,.35);color:var(--txt);padding:8px 16px;border-radius:6px;font-size:14px;letter-spacing:.06em;transition:all .12s}
.btn:hover,.btn.focus{background:rgba(60,200,230,.35);border-color:var(--cy);box-shadow:0 0 14px rgba(111,243,255,.4);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
h2{margin:0 0 10px;font-weight:300;letter-spacing:.25em;color:var(--cy);text-transform:uppercase;font-size:20px}
h3{margin:8px 0 6px;font-weight:400;letter-spacing:.12em;color:var(--cy);text-transform:uppercase;font-size:14px}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(111,243,255,.4) transparent}
.row{display:flex;align-items:center;gap:10px}
.small{font-size:12px;color:var(--dim)}
/* ---------------- loading / splash ---------------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#062633 0%,#01070b 70%);z-index:50;pointer-events:auto}
#loading .bar{width:320px;height:4px;background:rgba(111,243,255,.15);border-radius:2px;margin-top:18px;overflow:hidden}
#loading .bar>div{height:100%;width:0;background:var(--cy);box-shadow:0 0 12px var(--cy);transition:width .2s}
#loading .msg{margin-top:10px;font-size:12px;color:var(--dim);letter-spacing:.15em}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;pointer-events:auto;cursor:pointer}
#splash .press{margin-top:40px;letter-spacing:.4em;font-size:13px;color:var(--cy);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* ---------------- title / main menu ---------------- */
#title{position:fixed;inset:0;z-index:30;pointer-events:none}
#title .logoWrap{position:absolute;left:6vw;top:9vh;width:min(640px,60vw);filter:drop-shadow(0 0 18px rgba(80,220,255,.55))}
.logoWrap svg{width:100%;height:auto;display:block}
#mainMenu{position:absolute;left:6vw;top:calc(9vh + min(640px,60vw)*0.27 + 40px);display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.mitem{pointer-events:auto;cursor:pointer;font-size:22px;font-weight:300;letter-spacing:.3em;color:rgba(223,249,255,.78);padding:6px 16px 6px 14px;border-left:2px solid transparent;transition:all .15s;text-shadow:0 0 8px rgba(0,0,0,.6)}
.mitem:hover,.mitem.focus{color:#fff;border-left-color:var(--cy);background:linear-gradient(90deg,rgba(111,243,255,.18),transparent);text-shadow:0 0 12px var(--cy)}
.sub{position:absolute;left:calc(6vw + 300px);top:14vh;width:min(720px,60vw);max-height:76vh;padding:22px 26px;pointer-events:auto;display:flex;flex-direction:column}
.sub .body{flex:1;min-height:0}
.modeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mode{cursor:pointer;padding:12px;border:1px solid rgba(111,243,255,.25);border-radius:8px;background:rgba(10,60,80,.35);transition:all .12s}
.mode:hover,.mode.sel,.mode.focus{border-color:var(--cy);background:rgba(40,160,200,.3);box-shadow:0 0 14px rgba(111,243,255,.3)}
.mode b{display:block;letter-spacing:.15em;color:var(--cy);margin-bottom:4px;font-weight:500}
.mode span{font-size:12px;color:var(--dim)}
.slot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid rgba(111,243,255,.2);border-radius:8px;margin-bottom:8px;background:rgba(6,30,40,.5)}
.slot .info{font-size:12px;color:var(--dim)}
.opt{display:grid;grid-template-columns:200px 1fr 70px;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.opt input[type=range]{width:100%;accent-color:var(--cy);pointer-events:auto}
.opt select{pointer-events:auto;background:#06222e;color:var(--txt);border:1px solid rgba(111,243,255,.35);padding:4px;border-radius:4px}
.opt input[type=checkbox]{accent-color:var(--cy);width:18px;height:18px;pointer-events:auto}
.bind{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid rgba(111,243,255,.08);font-size:13px}
.bind .key{pointer-events:auto;cursor:pointer;text-align:center;padding:4px;border:1px solid rgba(111,243,255,.35);border-radius:4px;background:rgba(10,50,70,.5);font-family:monospace}
.bind .key.wait{background:rgba(255,207,74,.25);border-color:var(--warn)}
.bind .fixed{color:var(--dim);text-align:center;font-family:monospace}
.footer{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
/* ---------------- HUD ---------------- */
#hud{position:fixed;inset:0;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(223,249,255,.8);box-shadow:0 0 6px rgba(111,243,255,.8)}
#prompt{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);font-size:15px;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap;text-align:center}
#prompt .k{display:inline-block;padding:0 6px;border:1px solid var(--cy);border-radius:3px;margin-right:6px;color:var(--cy);font-size:12px}
#prompt .sub2{font-size:12px;color:var(--dim)}
#meters{position:absolute;left:26px;bottom:24px;width:230px;height:170px}
#meters svg{position:absolute;overflow:visible}
.mlabel{font-size:10px;letter-spacing:.12em;fill:var(--dim)}
#o2num{font-size:30px;font-weight:300;fill:#fff}
#depthBox{position:absolute;left:50%;top:48px;transform:translateX(-50%);text-align:center;font-size:24px;font-weight:300;letter-spacing:.08em;text-shadow:0 0 8px rgba(0,0,0,.8)}
#depthBox small{display:block;font-size:10px;letter-spacing:.3em;color:var(--dim)}
#depthBox.crush{color:var(--bad);animation:pulse .8s infinite}
#compass{position:absolute;left:50%;top:10px;width:min(620px,70vw);height:30px;transform:translateX(-50%);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
#compassStrip{position:absolute;top:0;height:30px;left:0;white-space:nowrap}
#compass .tick{position:absolute;top:18px;width:1px;height:8px;background:rgba(223,249,255,.6)}
#compass .card{position:absolute;top:0;font-size:15px;transform:translateX(-50%);color:#fff;text-shadow:0 0 6px rgba(111,243,255,.8)}
#compass .card.minor{font-size:11px;top:3px;color:var(--dim)}
#compass .bm{position:absolute;top:22px;width:7px;height:7px;transform:translateX(-50%) rotate(45deg);background:var(--warn)}
#compassNeedle{position:absolute;left:50%;top:0;width:2px;height:30px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#quick{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px}
.qs{width:58px;height:58px;border:1px solid rgba(111,243,255,.3);border-radius:8px;background:rgba(4,24,34,.55);position:relative}
.qs.sel{border-color:var(--cy);box-shadow:0 0 12px rgba(111,243,255,.55);background:rgba(20,90,110,.5)}
.qs img{width:100%;height:100%;object-fit:contain}
.qs .n{position:absolute;left:4px;top:1px;font-size:10px;color:var(--dim)}
.qs .bat{position:absolute;left:5px;right:5px;bottom:4px;height:3px;background:rgba(255,255,255,.15)}
.qs .bat>div{height:100%;background:var(--good)}
#notify{position:absolute;left:22px;top:22px;display:flex;flex-direction:column;gap:6px;width:360px}
.note{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(90deg,rgba(6,40,56,.85),rgba(6,40,56,0));border-left:2px solid var(--cy);font-size:14px;animation:noteIn .25s ease-out}
.note img{width:34px;height:34px}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
@keyframes noteIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
#subtitle{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);max-width:min(900px,80vw);text-align:center;font-size:18px;padding:6px 14px;background:rgba(0,0,0,.45);border-radius:6px;text-shadow:0 0 4px #000}
#subtitle b{color:var(--cy);font-weight:500;margin-right:8px}
#warning{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:22px;letter-spacing:.3em;color:var(--warn);text-shadow:0 0 12px rgba(255,180,0,.7);text-transform:uppercase;text-align:center}
#warning.bad{color:var(--bad);text-shadow:0 0 12px rgba(255,60,40,.8)}
#scanRing{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px}
#scanLabel{position:absolute;left:50%;top:calc(50% + 52px);transform:translateX(-50%);font-size:13px;color:var(--cy);letter-spacing:.1em;text-shadow:0 0 6px #000}
#beacons{position:absolute;inset:0;overflow:hidden}
.beacon{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:#fff;text-shadow:0 0 4px #000;white-space:nowrap}
.beacon i{display:block;margin:0 auto 2px;width:10px;height:10px;border:2px solid var(--warn);transform:rotate(45deg)}
.beacon.base i{border-color:var(--cy)}
.beacon.pod i{border-color:#ff9c3a;border-radius:50%;transform:none}
.beacon small{display:block;color:var(--dim)}
#vehHud{position:absolute;right:34px;bottom:28px;width:230px;padding:10px 14px;font-size:13px}
.vbar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin:3px 0 8px;overflow:hidden}
.vbar>div{height:100%}
#objective{position:absolute;right:26px;top:22px;max-width:320px;text-align:right;font-size:13px;color:var(--dim);text-shadow:0 0 4px #000}
#objective b{color:var(--cy);font-weight:400;letter-spacing:.15em;display:block;font-size:11px}
#fps{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--dim);font-family:monospace}
#timerBox{position:absolute;left:50%;top:92px;transform:translateX(-50%);color:var(--bad);font-size:16px;letter-spacing:.2em;text-shadow:0 0 8px rgba(255,60,40,.7)}
#holdBar{position:absolute;left:50%;top:calc(50% + 64px);width:160px;height:4px;margin-left:-80px;background:rgba(255,255,255,.15)}
#holdBar>div{height:100%;background:var(--cy)}
/* ---------------- PDA ---------------- */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(0,20,30,.35),rgba(0,0,0,.55))}
#pda .tablet{width:min(1100px,94vw);height:min(700px,88vh);display:flex;flex-direction:column;padding:14px 18px;border-radius:18px;border:2px solid rgba(111,243,255,.4);background:linear-gradient(160deg,rgba(8,44,60,.95),rgba(2,16,24,.96));box-shadow:0 0 50px rgba(0,190,230,.25),inset 0 0 60px rgba(0,120,160,.15)}
.tabs{display:flex;gap:4px;border-bottom:1px solid rgba(111,243,255,.25);padding-bottom:8px;margin-bottom:10px}
.tab{cursor:pointer;padding:6px 16px;letter-spacing:.15em;font-size:13px;color:var(--dim);border-radius:6px 6px 0 0}
.tab:hover{color:#fff}
.tab.sel{color:var(--cy);background:rgba(111,243,255,.1);box-shadow:inset 0 -2px 0 var(--cy)}
.tabBody{flex:1;min-height:0;display:flex;gap:16px}
.grid{display:grid;gap:2px;background:rgba(111,243,255,.08);padding:2px;border-radius:6px;position:relative}
.cell{width:52px;height:52px;background:rgba(4,26,36,.8);border-radius:3px}
.gitem{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:5px;background:radial-gradient(circle,rgba(40,140,170,.4),rgba(10,50,70,.6));border:1px solid rgba(111,243,255,.35);cursor:grab;pointer-events:auto}
.gitem:hover{border-color:#fff;box-shadow:0 0 10px rgba(111,243,255,.6)}
.gitem img{width:90%;height:90%;object-fit:contain;pointer-events:none}
.gitem .bat{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:rgba(255,255,255,.15)}
.gitem .bat>div{height:100%;background:var(--good)}
.equip{display:grid;grid-template-columns:repeat(2,64px);gap:20px 10px;align-content:start;padding-bottom:14px}
.eslot{width:64px;height:64px;border:1px dashed rgba(111,243,255,.35);border-radius:8px;position:relative;background:rgba(4,26,36,.6)}
.eslot .lab{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:9px;letter-spacing:.1em;color:var(--dim)}
.eslot .gitem{position:absolute;inset:3px}
#dragGhost{position:fixed;pointer-events:none;z-index:100;opacity:.85}
.tip{position:fixed;z-index:120;pointer-events:none;max-width:280px;padding:8px 10px;font-size:12px;background:rgba(2,18,26,.95);border:1px solid rgba(111,243,255,.4);border-radius:6px}
.tip b{color:var(--cy);display:block;font-size:13px;margin-bottom:3px}
.list{flex:0 0 280px;border-right:1px solid rgba(111,243,255,.15);padding-right:10px}
.li{cursor:pointer;padding:6px 8px;border-radius:4px;font-size:13px;color:var(--txt);display:flex;align-items:center;gap:8px}
.li img{width:26px;height:26px}
.li:hover{background:rgba(111,243,255,.1)}
.li.sel{background:rgba(111,243,255,.18);color:#fff}
.li.cat{color:var(--cy);letter-spacing:.15em;font-size:11px;text-transform:uppercase;cursor:default;margin-top:8px}
.li.cat:hover{background:none}
.li.new::after{content:"NEW";margin-left:auto;font-size:9px;color:var(--warn)}
.entry{flex:1;padding:4px 10px;font-size:14px;line-height:1.55;color:var(--txt)}
.entry h3{font-size:18px}
.entry .ph{width:100%;height:170px;border-radius:8px;background:radial-gradient(ellipse at center,rgba(30,120,150,.35),rgba(0,20,30,.6));display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.entry .ph img{height:150px}
.ping{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid rgba(111,243,255,.1);font-size:14px}
.ping input{pointer-events:auto;accent-color:var(--cy)}
.logline{font-size:13px;padding:4px 0;border-bottom:1px solid rgba(111,243,255,.06);color:var(--dim)}
.logline b{color:var(--txt);font-weight:400}
/* ---------------- fabricator (radial) ---------------- */
#fabUI .ring{position:relative;width:min(820px,94vw);height:min(640px,86vh)}
.fabCenter{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;letter-spacing:.15em;color:var(--cy);border:1px solid rgba(111,243,255,.4);background:radial-gradient(circle,rgba(20,110,140,.5),rgba(2,20,30,.85));box-shadow:0 0 40px rgba(0,200,240,.25)}
.fabNode{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(111,243,255,.35);background:radial-gradient(circle,rgba(24,90,112,.7),rgba(4,24,34,.9));transition:transform .12s}
.fabNode:hover,.fabNode.focus{transform:scale(1.12);border-color:#fff;box-shadow:0 0 16px rgba(111,243,255,.6)}
.fabNode img{width:62px;height:62px}
.fabNode.cant{filter:grayscale(.8) brightness(.6)}
.fabNode .lbl{position:absolute;top:80px;width:130px;left:-27px;text-align:center;font-size:11px;color:var(--txt);text-shadow:0 0 4px #000}
.fabNode.catn{width:90px;height:90px;margin:-45px 0 0 -45px;font-size:11px;letter-spacing:.12em;color:var(--cy);text-align:center}
#fabInfo{position:absolute;right:0;bottom:0;width:280px;padding:12px}
.ing{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.ing img{width:26px;height:26px}
.ing.miss{color:var(--bad)}
/* ---------------- builder menu ---------------- */
#buildUI .panel{width:min(900px,94vw);height:min(560px,84vh);padding:16px;display:flex;flex-direction:column}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px;align-content:start}
.bitem{cursor:pointer;height:110px;border:1px solid rgba(111,243,255,.3);border-radius:8px;background:rgba(6,34,46,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px}
.bitem img{width:64px;height:64px}
.bitem:hover{border-color:#fff;box-shadow:0 0 12px rgba(111,243,255,.5)}
.bitem.cant{opacity:.45}
.bitem.locked{opacity:.2;cursor:default}
/* ---------------- storage ---------------- */
#storageUI .panel{padding:16px;display:flex;gap:26px}
/* ---------------- pause / death / credits ---------------- */
#pause .panel{width:360px;padding:26px;display:flex;flex-direction:column;gap:8px}
#pause .sub{position:static;width:min(720px,90vw);max-height:80vh}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:none}
#deathMsg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;letter-spacing:.4em;color:#fff;font-weight:200}
#credits{position:fixed;inset:0;overflow:hidden;background:rgba(0,0,0,.35);pointer-events:auto}
#credits .roll{position:absolute;left:0;right:0;text-align:center;font-size:18px;line-height:2.1;font-weight:300;letter-spacing:.15em}
#credits .roll h1{font-weight:200;letter-spacing:.5em;color:var(--cy)}
#credits .roll h4{margin:40px 0 0;color:var(--cy);font-weight:400;letter-spacing:.3em;font-size:13px}
#clickLock{position:fixed;left:50%;top:60%;transform:translateX(-50%);padding:10px 18px;font-size:14px;letter-spacing:.2em;background:rgba(0,0,0,.5);border:1px solid var(--cy);border-radius:6px;pointer-events:auto;cursor:pointer}
#keypad .panel{padding:20px;width:280px;text-align:center}
#keypad .disp{font-family:monospace;font-size:28px;letter-spacing:.5em;margin:10px 0;padding:6px;background:#021016;border:1px solid rgba(111,243,255,.35);border-radius:6px;color:var(--cy)}
#keypad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#terminal .panel{width:min(640px,90vw);padding:22px;max-height:80vh}
#terminal .body{font-size:14px;line-height:1.6;white-space:pre-wrap}
#vehUI .panel{padding:18px;width:min(640px,94vw)}
.mods{display:flex;gap:10px;margin:10px 0 26px}
.mods .eslot{width:70px;height:70px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="loading"><div style="font-size:14px;letter-spacing:.5em;color:#6ff3ff">PLANET 4546B</div><div class="bar"><div id="loadBar"></div></div><div class="msg" id="loadMsg">INITIALISING</div></div>

  <div id="title" class="hidden">
    <div class="logoWrap" id="logoWrap"></div>
    <div id="mainMenu">
      <div class="mitem" data-act="play">PLAY</div>
      <div class="mitem" data-act="options">OPTIONS</div>
      <div class="mitem" data-act="controls">CONTROLS</div>
      <div class="mitem" data-act="databank">DATABANK</div>
      <div class="mitem" data-act="quit">QUIT</div>
    </div>
    <div class="sub panel hidden" id="playPanel">
      <h2>New Game</h2>
      <div class="modeGrid" id="modeGrid"></div>
      <h2 style="margin-top:6px">Continue / Load</h2>
      <div class="body scroll" id="slotList"></div>

// shared sway material for all flora
function makeSwayMaterial(opts = {}) {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: opts.roughness ?? 0.75, metalness: 0, side: THREE.DoubleSide });
  return extendOBC(m, (s) => {
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nattribute vec3 aEmis; attribute float aSway; varying vec3 vEmis; uniform float guTime; uniform vec3 guCurrent; uniform vec4 guDisturb[6];')
      .replace('#include <project_vertex>', `
        vec4 mvPosition = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          mvPosition = instanceMatrix * mvPosition;
          vec3 io = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        #else
          vec3 io = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        #endif
        vec4 swWP = modelMatrix * mvPosition;
        float ph = guTime * 0.75 + dot(io.xz, vec2(0.045, 0.061)) + io.y * 0.03;
        float air = step(0.5, io.y);
        vec3 cur = guCurrent * (sin(ph) * 0.55 + sin(ph * 2.3 + 1.3) * 0.25 + 0.3) * mix(1.0, 0.25, air);
        vec3 off = cur * aSway + vec3(sin(ph * 3.1 + swWP.y), 0.0, cos(ph * 2.7 + swWP.y)) * aSway * 0.08;
        for (int i = 0; i < 6; i++) { vec4 D = guDisturb[i]; if (D.w <= 0.0) continue; vec3 dv = swWP.xyz - D.xyz; float dl = length(dv); off += dv / max(dl, 0.01) * min(aSway, 1.5) * smoothstep(D.w * 2.5, 0.0, dl) * 0.9; }
        swWP.xyz += off;
        mvPosition = viewMatrix * swWP;
        gl_Position = projectionMatrix * mvPosition;
        vEmis = aEmis * (0.82 + 0.18 * sin(guTime * 1.7 + io.x * 0.7 + io.z * 0.3));`);
    s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vEmis;').replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += vEmis;');
  }, 'sway' + (opts.key || ''));
}

// ------------------------------------------------------------------ Materials: spine-deformed (individual creatures) and instanced swimmers (fish schools)
const CMat = {
  cache: new Map(),
  geometry(species, spine) { // cached finalized geometry per species/variant

    this.cache.set(k, out); return out;
  },
  spineMaterial(vis, SPN, opts = {}) {
    const mo = vis.mat || {};
    const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: opts.rough ?? 0.42, metalness: 0.04, side: THREE.DoubleSide, transparent: !!(mo.transparent && !opts.opaque), opacity: opts.opaque ? 1 : (mo.opacity ?? 1), depthWrite: !(mo.transparent && !opts.opaque) });
    const U = { uSpP: { value: Array.from({ length: SPN }, () => V3()) }, uSpR: { value: Array.from({ length: SPN }, () => V3(1, 0, 0)) }, uSpU: { value: Array.from({ length: SPN }, () => V3(0, 1, 0)) },
      uFlap: { value: new THREE.Vector4(0, 0, 1, 0) }, uHP: { value: Array.from({ length: 8 }, () => V3()) }, uHA: { value: Array.from({ length: 8 }, () => V3(1, 0, 0)) }, uPA: { value: new Array(8).fill(0) }, uInfl: { value: 0 }, uGlow: { value: 1 } };
    (vis.hinges || []).forEach((h, i) => { U.uHP.value[i].set(...h.p); U.uHA.value[i].set(...h.a).normalize(); });
    if (vis.flap) U.uFlap.value.set(vis.flap.amp * vis.L, 0, vis.flap.span * vis.L, 0);

      Object.assign(s.uniforms, this.userData.U);

        #define SPN ${SPN}
        attribute float aSpine; attribute float aPart; attribute vec3 aEmis; varying vec3 vEmis;
        uniform vec3 uSpP[SPN]; uniform vec3 uSpR[SPN]; uniform vec3 uSpU[SPN]; uniform vec4 uFlap; uniform vec3 uHP[8]; uniform vec3 uHA[8]; uniform float uPA[8]; uniform float uInfl; uniform float uGlow;
        vec3 rotAx(vec3 v, vec3 ax, float a) { float c = cos(a), s = sin(a); return v * c + cross(ax, v) * s + ax * dot(ax, v) * (1.0 - c); }`)
        .replace('#include <beginnormal_vertex>', `
          vec3 lp = position; vec3 ln = normal;
          int pi = int(aPart + 0.5) - 1;
          if (pi >= 0) { vec3 hp = uHP[pi]; vec3 ax = uHA[pi]; float an = uPA[pi]; lp = hp + rotAx(lp - hp, ax, an); ln = rotAx(ln, ax, an); }

// ------------------------------------------------------------------ Spine solver: body follows the trail of the head
// STUB: creature eyes are fixed to the head; per-eye tracking of the player is not animated (heads turn toward targets via steering).
class Spine {
  constructor(n, L) { this.n = n; this.L = L; this.trail = []; this.P = Array.from({ length: n }, () => V3()); this.R = Array.from({ length: n }, () => V3(1, 0, 0)); this.U = Array.from({ length: n }, () => V3(0, 1, 0)); this.spacing = L / (n - 1) / 2; this.prevP = Array.from({ length: n }, () => V3()); this.init = false; }
  reset(head, fwd) { this.trail.length = 0; for (let i = 0; i < 8; i++) this.trail.push(head.clone().addScaledVector(fwd, -i * this.L / 7)); this.init = true; }
  // head world pos, forward dir, bank angle, wave {amp (m), k (waves per body), phase}, rigid (0..1 stiffness)
  update(head, fwd, bank, wave, upRef = UP) {
    if (!this.init) this.reset(head, fwd);
    const tr = this.trail;
    // moving backwards: translate the whole trail rigidly
    const d0 = _v[0].subVectors(head, tr[0]);
    if (d0.dot(fwd) < -0.001) { for (const p of tr) p.add(d0); }
    else if (d0.length() > this.spacing) tr.unshift(head.clone()); else tr[0].copy(head);
    tr[0].copy(head);
    // trim
    let acc = 0; for (let i = 1; i < tr.length; i++) { acc += tr[i].distanceTo(tr[i - 1]); if (acc > this.L * 1.3) { tr.length = i + 1; break; } }
    // sample joints by arc length
    let seg = 0, segStart = 0, segLen = tr.length > 1 ? tr[0].distanceTo(tr[1]) : 0;
    for (let j = 0; j < this.n; j++) {
      const s = j / (this.n - 1) * this.L;
      while (seg < tr.length - 1 && segStart + segLen < s) { segStart += segLen; seg++; segLen = seg < tr.length - 1 ? tr[seg].distanceTo(tr[seg + 1]) : 0; }
      const P = this.P[j];
      if (seg >= tr.length - 1) { // extrapolate straight back
        const last = tr[tr.length - 1], prev = tr.length > 1 ? tr[tr.length - 2] : null; const dir = prev ? _v[1].subVectors(last, prev).normalize() : _v[1].copy(fwd).negate();
        if (!prev) dir.copy(fwd).negate();
        P.copy(last).addScaledVector(dir, s - (segStart + (seg < tr.length - 1 ? segLen : 0)));
      } else { const f = segLen > 1e-6 ? (s - segStart) / segLen : 0; P.lerpVectors(tr[seg], tr[seg + 1], f); }
    }
    // frames
    const F = _v[2];
    for (let j = 0; j < this.n; j++) {
      if (j === 0) F.subVectors(this.P[0], this.P[1]); else if (j === this.n - 1) F.subVectors(this.P[j - 1], this.P[j]); else F.subVectors(this.P[j - 1], this.P[j + 1]);
      if (F.lengthSq() < 1e-8) F.copy(fwd); F.normalize();
      const Rj = this.R[j].crossVectors(F, upRef); if (Rj.lengthSq() < 1e-6) Rj.set(1, 0, 0); Rj.normalize();
      this.U[j].crossVectors(Rj, F).normalize();
      if (bank) { const t = j / (this.n - 1), b = bank * (1 - t * 0.6); _q[0].setFromAxisAngle(F, b); Rj.applyQuaternion(_q[0]); this.U[j].applyQuaternion(_q[0]); }
    }
    // lateral undulation (travelling wave, amplitude grows toward the tail)
    if (wave && wave.amp > 0) for (let j = 1; j < this.n; j++) { const t = j / (this.n - 1); this.P[j].addScaledVector(this.R[j], wave.amp * Math.sin(wave.phase - t * wave.k * TAU) * ((wave.base ?? 0.15) + t * t)); }
  }
  // write joints relative to origin into uniform arrays (with interpolation between prev/cur for smooth rendering)
  write(U, origin) { for (let j = 0; j < this.n; j++) { U.uSpP.value[j].subVectors(this.P[j], origin); U.uSpR.value[j].copy(this.R[j]); U.uSpU.value[j].copy(this.U[j]); } }
}

// ------------------------------------------------------------------ Steering helpers (SDF based)
const Steer = {
  // returns free distance (m) from p to terrain (approx), and outward normal in n
  clearance(p, n) { return -Terrain.distN(p.x, p.y, p.z, n); },
  // obstacle avoidance: adjust desired direction so we slide along walls
  avoid(c, desired, look) {
    const n = _v[3], probe = _v[4];
    let danger = 0;
    for (const f of [1, 0.5]) {
      probe.copy(c.pos).addScaledVector(c.fwd, look * f);
      const d = TL.density(probe.x, probe.y, probe.z); if (d < -(c.r + look) * 2) continue;
      const cl = this.clearance(probe, n);
      const need = c.r + 1.2 + look * 0.25;
      if (cl < need) {
        const k = clamp((need - cl) / need, 0, 1.5); danger = Math.max(danger, k);
        // slide: remove component into the wall, then push outward
        const into = desired.dot(n); if (into < 0) desired.addScaledVector(n, -into * (1 + k));
        desired.addScaledVector(n, k * 1.2);
      }
    }
    // static colliders ahead (wrecks, base pieces, big flora)
    probe.copy(c.pos).addScaledVector(c.fwd, look * 0.6);
    const tmp = V3();
    if (Phys.resolveSphere(tmp.copy(probe), c.r + 0.8, 'ext', n, { noTerrain: true })) { desired.addScaledVector(n, 1.2); danger = Math.max(danger, 0.8); }
    if (desired.lengthSq() < 1e-6) desired.copy(n);
    desired.normalize();
    return danger;
  },
};

  // choose a new wander target inside the home zone and depth band, in open water
